[project]
name = "mytts"
version = "0.1.0"
description = "Offline book-to-audiobook converter (Qwen3-TTS on MLX)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio",
    "soundfile",
    "numpy",
    "mlx-whisper>=0.4.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.4.11",
    "python-multipart>=0.0.32",
    "pydantic>=2.13.5",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "python-docx>=1.2.0",
    "pymupdf>=1.28.2",
    "markdown-it-py>=4.2.0",
    "charset-normalizer>=3.5.1",
    "mobi>=0.4.1",
    "ocrmac>=1.0.1",
    "num2words>=0.5.14",
    "razdel>=0.5.0",
    "pysbd>=0.3.4",
    "mutagen>=1.48.1",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
]
silero = [
    "omegaconf>=2.3.1",
    "torch>=2.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["gpu: needs the real MLX model (run alone, under memguard)"]
addopts = "-m 'not gpu'"
tmp_path_retention_policy = "none"  # pytest keeps tmp dirs (with test WAVs) of past runs by default
