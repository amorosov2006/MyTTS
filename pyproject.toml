[project]
name = "mytts"
version = "0.1.0"
description = "Offline book-to-audiobook converter (Qwen3-TTS on MLX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio",
    "soundfile",
    "numpy",
    "mlx-whisper>=0.4.3",
]

[tool.uv]
package = false

[dependency-groups]
silero = [
    "omegaconf>=2.3.1",
    "torch>=2.14.0",
]
